[package]
name = "kapka-zivota"
version = "1.0.0"
description = "Kapka života — dárcovský deník"
authors = ["Vladimír Holub"]
edition = "2021"

[lib]
name = "kapka_zivota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
