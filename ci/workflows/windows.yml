name: Windows (Tauri)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/sync-www.sh'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync web assets
        shell: bash
        run: bash scripts/sync-www.sh

      - name: Install desktop CLI
        working-directory: desktop
        run: npm install --no-fund --no-audit

      - name: Generate icons
        working-directory: desktop
        shell: bash
        run: npx tauri icon ../icons/icon-512.png

      - name: Build Tauri (NSIS + MSI)
        working-directory: desktop
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kapka-zivota-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Draft prerelease (manual tag only)
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-windows-${{ github.run_number }}
          name: Test Windows build #${{ github.run_number }}
          draft: true
          prerelease: true
          body: |
            Testovací Windows instalátor Kapky života (Tauri).
            **Není finální release.** Před ostrým zveřejněním společně vyzkoušíme.

            Data: klíč `kapka-zivota-v1`. Přenos z PWA přes Export / obnovu JSON.
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
